[project]
name = "dyad"
version = "0.1.0"
description = "Dual-view analysis of language-model persona traits through latent-space steering and transfer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "numpy",
    "scipy",
    "peft",
    "matplotlib",
    "seaborn",
    "tqdm",
    "rich",
    "click",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "mypy",
]
wandb = [
    "wandb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=25.11.0",
    "isort>=7.0.0",
    "mypy>=1.18.2",
    "pytest>=9.0.0",
]
